<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم بالروبوت</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="robot">🤖</div>
    <h1>لوحة التحكم بالروبوت</h1>
    <p class="subtitle">اختاري اتجاه الحركة ليُحفظ الأمر في قاعدة البيانات.</p>

    <div class="connection">
      <span id="dot"></span>
      <span id="connectionText">جاهز لإرسال الأوامر</span>
    </div>

    <section class="controls" aria-label="أزرار تحريك الروبوت">
      <button class="forward" data-command="F"><b>↑</b>للأمام</button>
      <button class="left" data-command="L"><b>←</b>يسار</button>
      <button class="stop" data-command="S"><b>■</b>توقف</button>
      <button class="right" data-command="R"><b>→</b>يمين</button>
      <button class="backward" data-command="B"><b>↓</b>للخلف</button>
    </section>

    <section class="result" aria-live="polite">
      <small>آخر أمر</small>
      <strong id="lastCommand">S — توقف</strong>
      <p id="message">لم يتم إرسال أمر جديد بعد.</p>
    </section>

    <p class="legend">
      <code>F</code> أمام · <code>B</code> خلف · <code>L</code> يسار ·
      <code>R</code> يمين · <code>S</code> توقف
    </p>
  </main>
  <script src="script.js"></script>
</body>
</html>
